name: Daily Job Scan
# workflow registration nudge

on:
  schedule:
    - cron: '0 13 * * *'  # 1:00 PM UTC (~6 AM PT / 9 AM ET) daily
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      - name: Run daily job scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py scan-jobs

      - name: Score jobs against all profiles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py match-jobs
